name: Build TRYON LANKA APK

on:
  push:
    branches: [ "8.x", "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LabelStoreMax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Apply store settings from repository secrets (optional)
        env:
          WOOSIGNAL_APP_KEY: ${{ secrets.WOOSIGNAL_APP_KEY }}
          STORE_URL: ${{ secrets.STORE_URL }}
        run: |
          if [ -n "$WOOSIGNAL_APP_KEY" ]; then
            sed -i "s|^WOOSIGNAL_APP_KEY=.*|WOOSIGNAL_APP_KEY=\"$WOOSIGNAL_APP_KEY\"|" .env
            echo "WooSignal key applied"
          else
            echo "::warning::WOOSIGNAL_APP_KEY secret not set - the APK will open without store data until a key is added."
          fi
          if [ -n "$STORE_URL" ]; then
            sed -i "s|^APP_URL=.*|APP_URL=\"$STORE_URL\"|; s|^API_BASE_URL=.*|API_BASE_URL=\"$STORE_URL\"|" .env
          fi

      - name: Get packages
        run: flutter pub get

      - name: Patch old plugins for Android Gradle Plugin 9
        run: |
          # AGP 9 rejects getDefaultProguardFile('proguard-android.txt').
          grep -rl "proguard-android.txt" "$PUB_CACHE/hosted/pub.dev" --include=build.gradle* 2>/dev/null \
            | xargs -r sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g"
          echo "patched"

      - name: Generate env.g.dart
        run: dart run nylo_framework:main make:env

      - name: Try-On and translation tests
        run: flutter test test/tryon_fit_test.dart test/translations_test.dart

      - name: Full test suite (informational)
        continue-on-error: true
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation --build-number=${{ github.run_number }}

      - name: Build App Bundle
        continue-on-error: true
        run: flutter build appbundle --release --android-skip-build-dependency-validation --build-number=${{ github.run_number }}

      - name: Rename outputs
        run: |
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/tryon-lanka-${{ github.run_number }}.apk
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab ../dist/tryon-lanka-${{ github.run_number }}.aab
          fi
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: tryon-lanka-android-${{ github.run_number }}
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TRYON LANKA test build ${{ github.run_number }}
          prerelease: true
          body: |
            Installable Android test build (debug-signed, not for Play Store upload).
            Download the .apk on your phone and install it (allow "Install unknown apps").
          files: dist/*
